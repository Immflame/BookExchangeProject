services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: book_exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aidar2006
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    environment:
      AUTH_SERVICE_DATABASE_URL: postgres://postgres:aidar2006@db:5432/book_exchange?sslmode=disable
      AUTH_SERVICE_PORT: 8081
      AUTH_SERVICE_SECRET_KEY: secret_key
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./book-exchange
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/book_exchange
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: aidar2006
      AUTH_SERVICE_URL: http://auth-service:8081
      SPRING_DOC_SWAGGER_UI_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - auth-service

  frontend:
    build: ./book-exchange-frontend
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: